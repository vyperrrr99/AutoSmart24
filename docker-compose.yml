services:
  postgres:
    image: postgres:16
    # Senza questo un riavvio del PC lascia giu' tutto: lo scheduler delle
    # 22:00 vive nel container app, e cron continua a girare trovando l'API
    # spenta. Le guardie si comportano bene -- rifiutano invece di inventare --
    # ma non si raccoglie piu' nulla finche' qualcuno non risale a mano.
    restart: unless-stopped
    environment:
      POSTGRES_USER: autosmart24
      POSTGRES_PASSWORD: autosmart24
      POSTGRES_DB: autosmart24
    ports:
      # Solo localhost. Non 0.0.0.0, che renderebbe il database raggiungibile
      # da qualunque rete a cui il portatile si colleghi -- un wifi pubblico,
      # un albergo -- con utente e password banali.
      #
      # E non piu' l'indirizzo Tailscale, che serviva alla seconda macchina
      # ormai abbandonata. Legarsi a un IP che al momento del boot potrebbe non
      # esistere ancora e' una fragilita' vera: il 30/08, dopo cinque giorni di
      # spegnimento, Docker e' partito prima di tailscaled, postgres non e'
      # riuscito a legarsi ed e' uscito, e con lui e' rimasto giu' tutto --
      # app in ciclo di riavvio e nessuna raccolta. Se un giorno servisse di
      # nuovo, va aggiunta anche una dipendenza dall'interfaccia.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./scraper
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://autosmart24:autosmart24@postgres:5432/autosmart24
      SCRAPE_MIN_DELAY_SECONDS: "3"
      SCRAPE_MAX_DELAY_SECONDS: "8"
      # Tornata a 5 il 22/08. L'8 era giustificato solo dalla divisione su due
      # macchine con IP distinti, che e' stata annullata: su Windows Surfshark
      # non riesce a dare al contenitore un indirizzo di uscita separato senza
      # rompere Tailscale, perche' il suo split tunneling ragiona per
      # applicazione e il traffico dei container nasce dentro WSL2, dove non e'
      # attribuibile a nessun eseguibile.
      #
      # Da notare: la concorrenza non e' la causa dei blocchi su Fiat. Dei tre,
      # due sono avvenuti a 8 (19/08 e 22/08, dopo 24 e 25 minuti) e uno a 5
      # (21/08, dopo 83). Scendere allunga la resistenza, non la garantisce.
      #
      # Portata a 6 il 02/09/2026, un passo solo e non il ritorno a 8. La causa
      # vera dei blocchi era il difetto dei redirect, corretto il 22/08: da
      # allora 114 giri completati e zero blocchi. Ma quella e' evidenza che a 5
      # non ci blocchiamo, non che a 8 andremmo bene -- l'unico dato su 8 sono
      # due blocchi su due. Sei e' il passo piu' grande giustificabile dai dati
      # che abbiamo; per andare oltre servono altre settimane pulite a 6.
      SCRAPE_CONCURRENCY: "6"
      SCRAPE_MAX_LISTING_AGE_YEARS: "5"
      SCRAPE_SESSION_REFRESH_REQUESTS: "30"
    ports:
      - "8001:8000"

  dashboard:
    restart: unless-stopped
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - app
    ports:
      - "5173:80"

volumes:
  postgres_data:
