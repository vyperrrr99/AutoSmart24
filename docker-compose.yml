services:
  postgres:
    image: postgres:16
    # Senza questo un riavvio del PC lascia giu' tutto: lo scheduler delle
    # 22:00 vive nel container app, e cron continua a girare trovando l'API
    # spenta. Le guardie si comportano bene -- rifiutano invece di inventare --
    # ma non si raccoglie piu' nulla finche' qualcuno non risale a mano.
    restart: unless-stopped
    environment:
      POSTGRES_USER: autosmart24
      POSTGRES_PASSWORD: autosmart24
      POSTGRES_DB: autosmart24
    ports:
      # Non 0.0.0.0. Con la sola porta il database sarebbe raggiungibile da
      # qualunque rete a cui il portatile si colleghi -- un wifi pubblico, un
      # albergo -- con utente e password banali. Legato a localhost per i
      # processi di questa macchina (la BI usa localhost:5434) e all'indirizzo
      # Tailscale per la seconda macchina, che e' una rete privata.
      - "127.0.0.1:5434:5432"
      - "100.117.184.118:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./scraper
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://autosmart24:autosmart24@postgres:5432/autosmart24
      SCRAPE_MIN_DELAY_SECONDS: "3"
      SCRAPE_MAX_DELAY_SECONDS: "8"
      # Tornata a 8 il 22/08: il lavoro si divide su due macchine con IP
      # distinti, quindi la frequenza su ciascun indirizzo resta quella di
      # sempre. A 5 il solo giro di ricerca occupava 9,6 ore e non lasciava
      # margine per smaltire gli arretrati.
      SCRAPE_CONCURRENCY: "8"
      SCRAPE_MAX_LISTING_AGE_YEARS: "5"
      SCRAPE_SESSION_REFRESH_REQUESTS: "30"
    ports:
      - "8001:8000"

  dashboard:
    restart: unless-stopped
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - app
    ports:
      - "5173:80"

volumes:
  postgres_data:
