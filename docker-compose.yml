services:
  postgres:
    image: postgres:16
    # Senza questo un riavvio del PC lascia giu' tutto: lo scheduler delle
    # 22:00 vive nel container app, e cron continua a girare trovando l'API
    # spenta. Le guardie si comportano bene -- rifiutano invece di inventare --
    # ma non si raccoglie piu' nulla finche' qualcuno non risale a mano.
    restart: unless-stopped
    environment:
      POSTGRES_USER: autosmart24
      POSTGRES_PASSWORD: autosmart24
      POSTGRES_DB: autosmart24
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./scraper
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://autosmart24:autosmart24@postgres:5432/autosmart24
      SCRAPE_MIN_DELAY_SECONDS: "3"
      SCRAPE_MAX_DELAY_SECONDS: "8"
      # 21/08: 8 ha preso un 429 su Fiat con 11.780 pagine di arretrato.
      # Ridotta finche' l'arretrato dell'allargamento non e' smaltito.
      SCRAPE_CONCURRENCY: "5"
      SCRAPE_MAX_LISTING_AGE_YEARS: "5"
      SCRAPE_SESSION_REFRESH_REQUESTS: "30"
    ports:
      - "8001:8000"

  dashboard:
    restart: unless-stopped
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - app
    ports:
      - "5173:80"

volumes:
  postgres_data:
