# NON IN USO -- assetto abbandonato il 22/08/2026.
#
# La seconda macchina non e' mai entrata in servizio: Surfshark non riesce a
# dare al contenitore su Windows un indirizzo di uscita separato senza rompere
# Tailscale. Si lavora su una macchina sola con tutte e 26 le marche attive.
#
# ATTENZIONE: eseguirlo adesso metterebbe in pausa meta' catalogo.
# Conservato perche' torna utile se un giorno la divisione si rifa'.

# Configurazione per la SECONDA macchina (Windows).
#
#   docker compose -f docker-compose.yml -f docker-compose.seconda-macchina.yml \
#     up -d --no-deps app
#
# Differenze dalla prima macchina:
#
#  - nessun PostgreSQL locale. Il database e' uno solo, quello del ThinkPad,
#    raggiunto via Tailscale. Cosi' non esiste travaso: quello che questa
#    macchina raccoglie e' immediatamente visibile all'altra, e non ci sono
#    dump da riconciliare ne' sequenze da rimettere a posto.
#  - si avvia con --no-deps, altrimenti compose tirerebbe su anche un postgres
#    locale vuoto che nessuno userebbe. Provato: `depends_on: []` in un file di
#    override NON toglie la dipendenza, resta quella del file base.
#  - nessuna dashboard: si guarda quella del ThinkPad, che legge lo stesso
#    database.
#
# Il proxy si configura a livello di macchina (HTTPS_PROXY): httpx lo onora da
# solo. In alternativa si puo' passare SCRAPE_PROXY qui sotto.
services:
  app:
    environment:
      DATABASE_URL: postgresql+psycopg://autosmart24:autosmart24@100.117.184.118:5434/autosmart24
      SCRAPE_MIN_DELAY_SECONDS: "3"
      SCRAPE_MAX_DELAY_SECONDS: "8"
      SCRAPE_CONCURRENCY: "8"
      SCRAPE_MAX_LISTING_AGE_YEARS: "5"
      SCRAPE_SESSION_REFRESH_REQUESTS: "30"
      # SCRAPE_PROXY: "http://utente:chiave@uscita.surfshark:port"
